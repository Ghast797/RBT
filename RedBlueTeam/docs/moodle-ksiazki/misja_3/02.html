<h2>Podejrzane pendrive’y</h2>
<p>Nie wkładaj znalezionych lub podejrzanych pendrive’ów do swojego komputera, bo mogą one zawierać niebezpieczne wirusy. Pamiętaj, że każdy nośnik pamięci to potencjalne ryzyko infekcji. Aktywuj skanowanie dysków przenośnych w swoim programie antywirusowym.</p>
