<h2>Odnośniki w mailach</h2>
<p>Każdy mail posiadający odnośnik należy sprawdzić pod kątem złośliwego oprogramowania. Jeżeli nie jesteś pewny linku, zapytaj swojego administratora. Zalecane jest sprawdzenie, czy dany rodzaj wiadomości faktycznie został wysłany do pracowników oraz czy nadawca jest ci znany.</p>
