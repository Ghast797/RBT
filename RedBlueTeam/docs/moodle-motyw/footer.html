<!-- Administracja > Wygląd > Dodatkowy HTML > „Przed zamknięciem BODY” -->
<script>
  // 1) Przycisk jasny/ciemny: w pasku górnym (obok trybu edycji), a na stronach bez paska
  //    (logowanie) jako pływający przycisk w prawym górnym rogu.
  (function () {
    if (document.querySelector('.rbt-theme-toggle')) { return; }
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'rbt-theme-toggle';
    btn.title = 'Przełącz motyw jasny/ciemny';
    btn.setAttribute('aria-label', 'Przełącz motyw jasny/ciemny');
    btn.innerHTML =
      '<svg class="rbt-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>' +
      '<svg class="rbt-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
    btn.addEventListener('click', function () {
      var root = document.documentElement;
      var next = root.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-bs-theme', next);
      try { localStorage.setItem('rbt-theme', next); } catch (e) {}
    });
    var nav = document.getElementById('usernavigation');
    if (nav) {
      nav.insertBefore(btn, nav.firstChild);
    } else {
      btn.className += ' rbt-theme-toggle--floating';
      document.body.appendChild(btn);
    }
  })();

  // 2) Strona logowania: teksty Red Blue Team zamiast „Witamy w Moodle”.
  (function () {
    if (!document.body.classList.contains('pagelayout-login')) { return; }
    var left = document.querySelector('.login-layout-left-content');
    if (left) {
      left.innerHTML =
        '<span class="rbt-login-emblem" role="img" aria-label="Red Blue Team"></span>' +
        '<div class="rbt-login-eyebrow">&gt;_ red team &times; blue team</div>' +
        '<h1 class="h2 mb-3">Atakuj. Broń. Ucz się.</h1>' +
        '<p class="mb-3">Wcielasz się w etycznego hakera i poznajesz realne techniki ataku od środka – po to, by skuteczniej się przed nimi bronić.</p>' +
        '<p class="mb-0">Każda misja to realny scenariusz: decyzje, konsekwencje i raport po akcji.</p>' +
        '<div class="login-layout-stats">' +
          '<div class="login-layout-stat rbt-red"><strong class="login-layout-stat-value">Red Team</strong><span>atak</span></div>' +
          '<div class="login-layout-stat rbt-blue"><strong class="login-layout-stat-value">Blue Team</strong><span>obrona</span></div>' +
          '<div class="login-layout-stat"><strong class="login-layout-stat-value">Debrief</strong><span>wnioski</span></div>' +
        '</div>';
    }
    var subtitle = document.querySelector('.loginform > p.text-muted');
    if (subtitle) { subtitle.textContent = 'Zaloguj się, aby rozpocząć misję.'; }
  })();
</script>
