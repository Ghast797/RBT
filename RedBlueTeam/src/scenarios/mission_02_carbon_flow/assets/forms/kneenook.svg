<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="kn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091324"/>
      <stop offset="100%" stop-color="#0f1e38"/>
    </linearGradient>
    <filter id="kn-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#kn-bg)"/>
  <g stroke="#3b82f6" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="80" y1="0" x2="80" y2="300"/>
    <line x1="160" y1="0" x2="160" y2="300"/>
    <line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="320" y1="0" x2="320" y2="300"/>
  </g>

  <!-- Main Card (VR style: pale ice-blue card, blue circle K + Kneenook) -->
  <g filter="url(#kn-shadow)">
    <rect x="44" y="20" width="312" height="260" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  </g>

  <!-- Header -->
  <g transform="translate(88, 36)">
    <circle cx="21" cy="21" r="20" fill="#1d4ed8"/>
    <text x="21" y="29" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="900" fill="#ffffff">K</text>
    <text x="54" y="29" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#2563eb">
      Kneenook
    </text>
  </g>

  <line x1="68" y1="90" x2="332" y2="90" stroke="#bfdbfe" stroke-width="1.5"/>

  <!-- Content -->
  <text x="200" y="114" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#1e3a8a" letter-spacing="1.4">
    TWÓJ POST
  </text>

  <!-- Post Wireframe -->
  <rect x="78" y="128" width="244" height="72" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <circle cx="102" cy="148" r="9" fill="#3b82f6"/>
  <rect x="118" y="142" width="110" height="6" rx="3" fill="#93c5fd"/>
  <rect x="118" y="153" width="66" height="5" rx="2.5" fill="#bfdbfe"/>
  <rect x="94" y="170" width="210" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="94" y="182" width="160" height="6" rx="3" fill="#cbd5e1"/>

  <!-- Blue CTA Button -->
  <rect x="82" y="216" width="236" height="44" rx="9" fill="#1d4ed8"/>
  <text x="200" y="243" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#ffffff" letter-spacing="1">
    ZOBACZ NA KNEENOOK
  </text>
</svg>
