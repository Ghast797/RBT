<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="pf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1612"/>
      <stop offset="100%" stop-color="#0d2219"/>
    </linearGradient>
    <linearGradient id="pf-header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <filter id="pf-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#pf-bg)"/>
  <!-- subtle grid -->
  <g stroke="#22c55e" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="80" y1="0" x2="80" y2="300"/>
    <line x1="160" y1="0" x2="160" y2="300"/>
    <line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="320" y1="0" x2="320" y2="300"/>
  </g>

  <!-- Main Form Card (VR style: green top bar + cream body) -->
  <g filter="url(#pf-shadow)">
    <rect x="44" y="20" width="312" height="260" rx="8" fill="#f5f1d8" stroke="#bbf7d0" stroke-width="2"/>
    <path d="M 44 28 a 8 8 0 0 1 8 -8 h 296 a 8 8 0 0 1 8 8 v 46 h -312 z" fill="url(#pf-header)"/>
  </g>

  <!-- Poodle Forms Title -->
  <g transform="translate(64, 52)">
    <rect x="-4" y="-18" width="22" height="24" rx="3" fill="#22c55e" fill-opacity="0.25" stroke="#86efac" stroke-width="1.5"/>
    <line x1="1" y1="-11" x2="13" y2="-11" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="1" y1="-6" x2="13" y2="-6" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="1" y1="-1" x2="9" y2="-1" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <text x="30" y="0" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="0.5">
      Poodle <tspan font-size="14" font-weight="600" letter-spacing="1.5" fill="#dcfce7">FORMS</tspan>
    </text>
  </g>

  <!-- Survey subtitle + clean form wireframe -->
  <text x="200" y="102" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#1e293b" letter-spacing="1.2">
    TWOJA ANKIETA
  </text>
  <line x1="72" y1="112" x2="328" y2="112" stroke="#d6d1b1" stroke-width="1.5"/>

  <!-- Question rows -->
  <g transform="translate(74, 126)">
    <circle cx="8" cy="8" r="6" fill="none" stroke="#15803d" stroke-width="2"/>
    <circle cx="8" cy="8" r="2.8" fill="#15803d"/>
    <rect x="24" y="4" width="170" height="8" rx="4" fill="#cfc9a8"/>

    <circle cx="8" cy="34" r="6" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <rect x="24" y="30" width="135" height="8" rx="4" fill="#dbd6b8"/>

    <circle cx="8" cy="60" r="6" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <rect x="24" y="56" width="195" height="8" rx="4" fill="#dbd6b8"/>
  </g>

  <!-- Green CTA button -->
  <rect x="82" y="216" width="236" height="44" rx="9" fill="#14532d"/>
  <text x="200" y="243" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="1">
    WYPEŁNIJ FORMULARZ
  </text>
</svg>
