<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="qg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0b16"/>
      <stop offset="100%" stop-color="#22101a"/>
    </linearGradient>
    <linearGradient id="qg-ig" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="qg-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#qg-bg)"/>
  <g stroke="#f43f5e" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="80" y1="0" x2="80" y2="300"/>
    <line x1="160" y1="0" x2="160" y2="300"/>
    <line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="320" y1="0" x2="320" y2="300"/>
  </g>

  <!-- Main Card (VR style: crisp white card, IG camera badge + cursive Quickgram) -->
  <g filter="url(#qg-shadow)">
    <rect x="44" y="20" width="312" height="260" rx="8" fill="#ffffff" stroke="#fda4af" stroke-width="2"/>
  </g>

  <!-- Header -->
  <g transform="translate(88, 36)">
    <rect x="0" y="0" width="42" height="42" rx="11" fill="url(#qg-ig)"/>
    <rect x="7" y="7" width="28" height="28" rx="7" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="21" cy="21" r="6.5" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="29.5" cy="12.5" r="2" fill="#ffffff"/>
    <text x="56" y="30" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="27" font-weight="700" fill="#1e293b">
      Quickgram
    </text>
  </g>

  <line x1="68" y1="90" x2="332" y2="90" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Content -->
  <text x="200" y="114" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#334155" letter-spacing="1.4">
    OBSERWUJ
  </text>

  <!-- Mini Photo Feed Preview -->
  <rect x="86" y="128" width="228" height="72" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="110" cy="150" r="10" fill="url(#qg-ig)"/>
  <rect x="128" y="143" width="90" height="7" rx="3.5" fill="#cbd5e1"/>
  <rect x="128" y="155" width="56" height="5" rx="2.5" fill="#e2e8f0"/>
  <path d="M 102 184 l 16 -14 l 14 10 l 22 -18 l 24 22 z" fill="#fda4af" fill-opacity="0.5"/>
  <circle cx="282" cy="152" r="5" fill="#fb7185"/>
  <rect x="190" y="172" width="106" height="10" rx="5" fill="#e2e8f0"/>

  <!-- Red CTA Button -->
  <rect x="82" y="216" width="236" height="44" rx="9" fill="#b93838"/>
  <text x="200" y="243" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="1.2">
    SPRAWDŹ TO
  </text>
</svg>
