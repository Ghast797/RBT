<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <radialGradient id="desk-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e1b2a"/>
      <stop offset="100%" stop-color="#050a11"/>
    </radialGradient>
    <linearGradient id="paper-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1e6ce"/>
      <stop offset="55%" stop-color="#e7d9b9"/>
      <stop offset="100%" stop-color="#d9c8a3"/>
    </linearGradient>
    <linearGradient id="paper-flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4ebd5"/>
      <stop offset="100%" stop-color="#dfd0ae"/>
    </linearGradient>
    <filter id="env-shadow" x="-10%" y="-12%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="flap-shadow" x="-5%" y="-5%" width="110%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5c4c32" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Dark hacker desk surface -->
  <rect width="640" height="400" fill="url(#desk-bg)"/>
  <g stroke="#00f0ff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="160" x2="640" y2="160"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="320" x2="640" y2="320"/>
    <line x1="128" y1="0" x2="128" y2="400"/>
    <line x1="256" y1="0" x2="256" y2="400"/>
    <line x1="384" y1="0" x2="384" y2="400"/>
    <line x1="512" y1="0" x2="512" y2="400"/>
  </g>

  <!-- Horizontal (landscape) paper envelope -->
  <g filter="url(#env-shadow)">
    <rect x="44" y="48" width="552" height="304" rx="10" fill="url(#paper-body)" stroke="#b8a47b" stroke-width="2.5"/>

    <!-- Inner subtle paper folds (left/right/bottom seams) -->
    <polyline points="46,348 232,198 408,198 594,348" fill="#decfa9" fill-opacity="0.35" stroke="#c3b088" stroke-width="1.5"/>
    <line x1="46" y1="54" x2="232" y2="198" stroke="#c3b088" stroke-width="1.2" opacity="0.6"/>
    <line x1="594" y1="54" x2="408" y2="198" stroke="#c3b088" stroke-width="1.2" opacity="0.6"/>

    <!-- Subtle highlight frame inside envelope -->
    <rect x="46" y="50" width="548" height="300" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5"/>

    <!-- Top sealed triangular flap -->
    <g filter="url(#flap-shadow)">
      <path d="M 46 54 Q 46 49 52 49 L 588 49 Q 594 49 594 54 L 330 156 Q 320 160 310 156 Z" fill="url(#paper-flap)" stroke="#b8a47b" stroke-width="2"/>
    </g>

    <!-- Subtle circular adhesive seal / tape mark at flap tip -->
    <circle cx="320" cy="152" r="11" fill="#e6d8b8" fill-opacity="0.65" stroke="#bfa97d" stroke-width="1" stroke-dasharray="3 2"/>

    <!-- Writing area guide line (very faint) -->
    <line x1="120" y1="278" x2="520" y2="278" stroke="#a6926c" stroke-width="1.2" stroke-dasharray="6 5" opacity="0.45"/>
  </g>
</svg>
