<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <filter id="rw-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Pure transparent background so ScratchMatrix provides one uniform backdrop -->
  <g filter="url(#rw-glow)">
    <rect x="175" y="125" width="250" height="180" rx="16" fill="#180a10" fill-opacity="0.7" stroke="#f43f5e" stroke-width="7"/>
    <path d="M 255 125 v -24 a 12 12 0 0 1 12 -12 h 66 a 12 12 0 0 1 12 12 v 24" fill="none" stroke="#f43f5e" stroke-width="7"/>
    <line x1="175" y1="184" x2="425" y2="184" stroke="#fb7185" stroke-width="2.5" opacity="0.65"/>

    <path d="M 270 192 v -26 a 30 30 0 0 1 60 0 v 26" fill="none" stroke="#fda4af" stroke-width="9" stroke-linecap="round"/>
    <rect x="255" y="192" width="90" height="72" rx="10" fill="#be123c" stroke="#fda4af" stroke-width="3.5"/>
    <circle cx="300" cy="222" r="9.5" fill="#090508"/>
    <path d="M 294 228 l -3 20 h 18 l -3 -20 z" fill="#090508"/>
  </g>
</svg>
